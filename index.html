<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card{
           width: 350px;
           padding: 30px;
           text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }
        .profile-img{
            width: 120px;
            height:120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid blue;
            margin-bottom:15px ;
        }
        h3{
            color: rgb(91, 8, 186);
        }
        h4{
            color: gray;
        }
        .list{
            color: rgb(91, 8, 186);;
        }
       
        .skills{
            display: flex;
            justify-content: center;
            gap:8px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .skill{
            background-color: aliceblue;
            color:rgb(107, 8, 198);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .button{
            display: flex;
            justify-content: center;
            gap:10px;
        }
        button{
            background-color: rgb(20, 20, 239);
            border: none;
            color:white;
            padding: 11px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover{
            background-color: rgb(20, 20, 215);
        }


    </style>
</head>
<body>
    <div class="card">
        <img
        class="profile-img"
         src="https://static.vecteezy.com/system/resources/thumbnails/059/230/095/small/portrait-of-a-sweet-little-girl-wearing-a-black-hat-in-the-autumn-a-stunning-representation-of-childhood-joy-free-photo.jpg" alt="">
        <h1>Priya Rahul</h1>
       <h3>Java Full Stack Development</h3>
       <h4>📍Bengaluru</h4>
       <h4>📧priya@example.com</h4>
        

     <div class="skills">
      <span class="skill">HTML</span>
      <span class="skill">CSS</span>
      <span class="skill">Java</span>
      <span class="skill">JavaScript</span>
    </div>

    <div class="buttons">
      <button>View Profile</button>
      <button>Contact</button>
    </div>


    </div>
    
</body>
</html>
